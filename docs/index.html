<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2448c7">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시리 토익">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>시리 토익</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
/* Layout: 학습지 한 장. 상단 고정 컨트롤 바 + 단어 행(번호·단어·뜻) 목록, 카드 모드는 한 장씩. 블라인드는 '빨간 암기 시트'로 가린다. */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#1b2433; --muted:#5f6b7d; --line:#dde2ea;
  --accent:#2448c7; --accent-soft:#e6ecfb; --sheet:#d7263d; --sheet-ink:#ffffff; --ok:#13795b; --ok-soft:#e2f3ec; --siri:#a3366d; --siri-soft:#f9e8f1;
  --f-word:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --paper:#171c25; --ink:#e7ebf2; --muted:#98a3b5; --line:#2a3240;
  --accent:#8ea8ff; --accent-soft:#1f2a47; --sheet:#c2283d; --sheet-ink:#ffffff; --ok:#5fd0a5; --ok-soft:#163328; --siri:#f08cc0; --siri-soft:#3a2231; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --paper:#171c25; --ink:#e7ebf2; --muted:#98a3b5; --line:#2a3240;
  --accent:#8ea8ff; --accent-soft:#1f2a47; --sheet:#c2283d; --sheet-ink:#ffffff; --ok:#5fd0a5; --ok-soft:#163328; --siri:#f08cc0; --siri-soft:#3a2231; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overscroll-behavior-y:none}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px;display:grid;gap:10px}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
h1 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.progress{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.sets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.set{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.set[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.set:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}

.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lbl{font-size:11px;letter-spacing:.06em;color:var(--muted);margin-right:4px}
.ctl{display:inline-flex;align-items:center}
.tog{border:1px solid var(--line);background:transparent;border-radius:7px;padding:5px 11px;font-size:13px;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--paper);color:var(--ink)}

main .wrap{padding-block:16px 48px}
.notice{font-size:13px;color:var(--muted);margin:0 0 12px}

/* list */
.list{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row.known{background:var(--ok-soft)}
.num{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums}
.main{min-width:0;display:grid;gap:4px}
.head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.word{font-family:var(--f-word);font-size:21px;font-weight:700;letter-spacing:-.005em}
.means{display:grid;gap:2px}
.ipa{font-family:var(--f-body);font-size:14px;color:var(--muted);margin-left:8px;white-space:nowrap}
.card .ipa{display:block;margin:2px 0 0;font-size:18px}
.mean{display:flex;gap:6px;align-items:baseline}
.pos{flex:none;font-size:11px;font-weight:600;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:1.5}
.ex{margin-top:4px;padding-left:10px;border-left:2px solid var(--line);font-size:14px;display:grid;gap:1px}
.ex .en{font-family:var(--f-word);font-size:15px;display:flex;gap:6px;align-items:flex-start}
.ex .ko{color:var(--muted);font-size:13px}
.ex .none{color:var(--muted);font-size:12px}
.ex mark{background:transparent;color:var(--accent);font-weight:700}
.side{display:flex;gap:4px}
.icon{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);flex:none}
.icon:hover{color:var(--accent);border-color:var(--accent)}
.icon.speaking{color:var(--paper);background:var(--accent);border-color:var(--accent)}
.icon.sm{width:24px;height:24px;border-radius:6px}
.icon svg{width:16px;height:16px}
.icon.sm svg{width:13px;height:13px}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--paper)}

/* red sheet blind */
.blind{position:relative;border-radius:4px}
span.blind{display:inline-block}
.blind.covered{cursor:pointer}
.blind.covered::after{content:"탭해서 보기";position:absolute;inset:-2px -4px;border-radius:5px;background:var(--sheet);color:var(--sheet-ink);font-size:11px;letter-spacing:.04em;display:grid;place-items:center;opacity:.94;
  background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.08) 6px 12px)}
.blind.covered:hover::after{opacity:.85}

/* card */
.card-stage{display:grid;gap:14px;justify-items:center}
.card{width:100%;max-width:520px;min-height:300px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px 22px;display:grid;align-content:center;justify-items:center;gap:14px;text-align:center;cursor:pointer;position:relative}
.card .num{position:absolute;top:12px;left:14px;padding:0}
.card .word{font-size:38px}
.card .means{justify-items:center}
.card .mean{font-size:17px}
.card .ex{border-left:0;padding:0;text-align:center;justify-items:center;max-width:44ch}
.card .ex .en{justify-content:center}
.hint{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 16px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:80px;text-align:center}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:520px){
  .row{grid-template-columns:34px minmax(0,1fr);}
  .side{grid-column:2;}
  .word{font-size:19px}
  .card .word{font-size:30px}
}
/* 시리 예문 */
.ex+.ex{margin-top:6px}
.ex.siri{border-left-color:var(--siri)}
.tag{flex:none;font-size:10px;font-weight:600;letter-spacing:.04em;border-radius:4px;padding:1px 5px;line-height:1.5;margin-top:3px;background:var(--siri-soft);color:var(--siri)}
.ex.toeic .tag{background:var(--accent-soft);color:var(--accent)}
.ex .en .tx{flex:1;min-width:0}
.card .ex{width:100%}
.card .ex .en{text-align:left}
/* 잠금 화면 */
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left))}
#lock[hidden]{display:none}
.lockbox{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
.lockbox h2{margin:0;font-size:20px}
.lockbox p{margin:0;color:var(--muted);font-size:13px}
.lockbox input[type=password],.lockbox input[type=text]{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);text-align:center;width:100%}
.lockbox .btn{padding:12px;font-size:16px}
.lockbox label{font-size:13px;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
.lockbox .err{color:var(--sheet);min-height:1.4em;font-size:13px}
/* 모바일 */
.gear{display:none}
.progress{white-space:nowrap}
.tog,.seg button,select,.btn{min-height:36px}
@media (max-width:640px){
  header .wrap{padding-block:8px;gap:8px}
  h1{font-size:16px;white-space:nowrap}
  h1 small,.progress .all{display:none}
  .progress{font-size:11px}
  .gear{display:inline-grid}
  .controls{display:none;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  header.open .controls{display:grid;gap:10px}
  .titlebar{flex-wrap:nowrap;align-items:center}
  .titlebar .right{display:flex;gap:8px;align-items:center}
  .set{padding:7px 12px}
  .icon{width:40px;height:40px}.icon.sm{width:32px;height:32px}
  .row{padding:14px 12px}
  .ex .en{font-size:16px}
  .nav .btn{min-width:104px;min-height:48px;font-size:16px}
  .card{min-height:52vh;padding:20px 16px}
  main .wrap{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
}
.titlebar .right{display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="titlebar">
      <h1>시리 토익<small id="rangeLabel">1–100</small></h1>
      <span class="right"><span class="progress" id="progress"></span>
        <button class="icon" id="themeBtn" aria-label="화면 모드 바꾸기" title="자동 / 라이트 / 다크"></button>
        <button class="icon gear" id="gearBtn" aria-label="설정 열기" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></span>
    </div>
    <div class="sets" id="sets" role="group" aria-label="세트 선택"></div>
    <div class="controls">
      <span class="ctl"><span class="lbl">보기</span>
        <span class="seg" id="modeSeg"><button data-v="list" aria-pressed="true">목록</button><button data-v="card" aria-pressed="false">카드</button></span></span>
      <span class="ctl"><span class="lbl">블라인드</span>
        <span class="seg" id="blindSeg"><button data-v="none" aria-pressed="true">끔</button><button data-v="en" aria-pressed="false">영어</button><button data-v="ko" aria-pressed="false">뜻</button></span></span>
      <span class="ctl"><span class="lbl">예문</span>
        <span class="seg" id="exSeg"><button data-v="off" aria-pressed="false">끔</button><button data-v="toeic" aria-pressed="false">토익</button><button data-v="siri" aria-pressed="false">시리</button><button data-v="both" aria-pressed="true">둘 다</button></span></span>
      <button class="tog" id="unknownTog" aria-pressed="false">안 외운 것만</button>
      <button class="tog" id="shuffleBtn" aria-pressed="false">섞기</button>
      <button class="tog" id="lockBtn" aria-pressed="false">잠그기</button>
      <span class="ctl"><span class="lbl">발음</span>
        <select id="accent" aria-label="억양"><option value="en-US">미국</option><option value="en-GB">영국</option><option value="en-AU">호주</option></select>
        <select id="rate" aria-label="속도" style="margin-left:4px"><option value="0.7">느리게</option><option value="0.9" selected>보통</option><option value="1.1">빠르게</option></select></span>
    </div>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<div id="lock">
  <form class="lockbox" id="lockForm" autocomplete="off">
    <h2>시리 토익</h2>
    <p>허용된 사람만 볼 수 있어요. 비밀번호를 입력하세요.</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" enterkeyhint="go">
    <label><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
    <button class="btn primary" id="unlockBtn" type="submit">열기</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</div>

<script>
(function(){
let ALL = [];
const SETS = Array.from({length:48},(_,i)=>({n:i+1,from:i*25+1,to:i*25+25}));
const store = {
  get(k,d){try{const v=localStorage.getItem('toeic.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('toeic.'+k,JSON.stringify(v))}catch(e){}}
};
const S = {
  set: store.get('set25',1), mode: store.get('mode','list'), blind: store.get('blind','none'),
  ex: store.get('ex','both'), theme: store.get('theme','auto'), onlyUnknown:false, shuffled:false,
  known: new Set(store.get('known',[])), revealed:new Set(), idx:0, flipped:false, order:null,
  accent: store.get('accent','en-US'), rate: store.get('rate','0.9')
};
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON_SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- 발음 (Web Speech API) ---------- */
let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices()}catch(e){voices=[]} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(lang){
  const c=voices.filter(v=>v.lang&&v.lang.replace('_','-').startsWith(lang));
  return c.find(v=>/Google|Samantha|Daniel|Karen|Natural|Online/i.test(v.name))||c[0]||voices.find(v=>/^en/i.test(v.lang))||null;
}
function speak(text,btn){
  if(!('speechSynthesis' in window)){ toastMsg('이 브라우저는 음성 읽기를 지원하지 않아요'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=S.accent; u.rate=parseFloat(S.rate); const v=pickVoice(S.accent); if(v) u.voice=v;
  if(btn){ btn.classList.add('speaking'); const off=()=>btn.classList.remove('speaking'); u.onend=off; u.onerror=off; }
  speechSynthesis.speak(u);
}
function toastMsg(t){ const n=$('#view .notice'); if(n) n.textContent=t; }

/* ---------- 데이터 ---------- */
function currentWords(){
  const s=SETS[S.set-1];
  let list=ALL.filter(w=>w.id>=s.from&&w.id<=s.to);
  if(S.onlyUnknown) list=list.filter(w=>!S.known.has(w.id));
  if(S.shuffled){
    if(!S.order){ S.order=list.map(w=>w.id).sort(()=>Math.random()-.5); }
    const pos=new Map(S.order.map((id,i)=>[id,i]));
    list=list.slice().sort((a,b)=>(pos.get(a.id)??1e9)-(pos.get(b.id)??1e9));
  }
  return list;
}
function maskWord(sentence,word){
  // 예문에서 표제어(및 변화형)를 강조하거나 가린다
  const stem=word.toLowerCase().replace(/(e|y|ies|s)$/,'');
  const re=new RegExp('\\b('+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*)\\b','i');
  const safe=esc(sentence);
  if(S.blind==='en'&&!S.revealed.has('en'+word)&&!(S.mode==='card'&&S.flipped)) return safe.replace(re,m=>'_'.repeat(Math.max(4,m.length)));
  return safe.replace(re,'<mark>$1</mark>');
}

/* ---------- 렌더 ---------- */
function blindAttr(kind,id){
  const key=kind+id; const covered=S.blind===kind&&!S.revealed.has(key);
  return `class="blind${covered?' covered':''}" data-reveal="${key}"${covered?' tabindex="0" role="button" aria-label="가린 내용 보기"':''}`;
}
function wordHTML(w){ return `<span class="word">${esc(w.word)}</span>${w.ipa?`<span class="ipa">/${esc(w.ipa)}/</span>`:''}`; }
function meansHTML(w){
  return `<div class="means">${w.means.map(m=>`<div class="mean">${m[0]?`<span class="pos">${m[0]}</span>`:''}<span>${esc(m[1])}</span></div>`).join('')}</div>`;
}
function oneEx(w,kind,en,ko){
  const label=kind==='siri'?'시리':'토익';
  return `<div class="ex ${kind}"><div class="en"><span class="tag">${label}</span><span class="tx">${maskWord(en,w.word)}</span><button class="icon sm" data-say="${esc(en)}" aria-label="${label} 예문 듣기">${ICON_SPK}</button></div><div ${blindAttr('ko',w.id+(kind==='siri'?'s':'x'))}><span class="ko">${esc(ko)}</span></div></div>`;
}
function exHTML(w){
  if(S.ex==='off') return '';
  const out=[];
  if(S.ex!=='siri'&&w.ex) out.push(oneEx(w,'toeic',w.ex,w.exKo));
  if(S.ex!=='toeic'&&w.siri) out.push(oneEx(w,'siri',w.siri,w.siriKo));
  if(!out.length) return `<div class="ex"><span class="none">예문 준비 중</span></div>`;
  return out.join('');
}
function renderSets(){
  const have=new Set(ALL.map(w=>Math.ceil(w.id/25)));
  $('#sets').innerHTML=SETS.map(s=>`<button class="set" data-set="${s.n}" aria-pressed="${s.n===S.set}" ${have.has(s.n)?'':'disabled title="이 구간 PDF가 없어요"'}>${s.from}–${s.to}</button>`).join('');
  const s=SETS[S.set-1]; $('#rangeLabel').textContent=`${s.from}–${s.to}`;
  const on=document.querySelector('.set[aria-pressed="true"]'), box=$('#sets');
  if(on&&box) box.scrollLeft=on.offsetLeft-box.clientWidth/2+on.offsetWidth/2;
}
function renderProgress(){
  const s=SETS[S.set-1]; const inSet=ALL.filter(w=>w.id>=s.from&&w.id<=s.to);
  const k=inSet.filter(w=>S.known.has(w.id)).length;
  $('#progress').innerHTML=`외움 ${k}/${inSet.length}<span class="all"> · 전체 ${S.known.size}/${ALL.length}</span>`;
}
function renderList(){
  const list=currentWords();
  if(!list.length) return `<div class="list"><div class="empty">${S.onlyUnknown?'이 세트는 다 외웠어요.':'이 세트에 단어가 없어요.'}</div></div>`;
  return `<p class="notice">빨간 시트를 탭하면 하나씩 보여요. 단어 옆 스피커는 발음, ✓는 외운 단어 표시.</p><div class="list">`+list.map(w=>`
    <div class="row${S.known.has(w.id)?' known':''}">
      <span class="num">${w.id}</span>
      <div class="main">
        <div class="head"><span ${blindAttr('en',w.word)}>${wordHTML(w)}</span></div>
        <div ${blindAttr('ko',w.id)}>${meansHTML(w)}</div>
        ${exHTML(w)}
      </div>
      <div class="side">
        <button class="icon" data-say="${esc(w.word)}" aria-label="${esc(w.word)} 발음 듣기">${ICON_SPK}</button>
        <button class="icon check" data-known="${w.id}" aria-pressed="${S.known.has(w.id)}" aria-label="외운 단어로 표시">${ICON_OK}</button>
      </div>
    </div>`).join('')+`</div>`;
}
function renderCard(){
  const list=currentWords();
  if(!list.length) return `<div class="empty">${S.onlyUnknown?'이 세트는 다 외웠어요.':'단어가 없어요.'}</div>`;
  if(S.idx>=list.length) S.idx=0;
  const w=list[S.idx];
  // 카드 모드: 블라인드 '영어' = 뜻을 보고 단어 맞히기, 그 외 = 단어 보고 뜻 맞히기
  const front= S.blind==='en'
    ? `${meansHTML(w)}`
    : wordHTML(w);
  const back = S.blind==='en'
    ? `${wordHTML(w)}${exHTML(w)}`
    : `${meansHTML(w)}${exHTML(w)}`;
  return `<div class="card-stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="카드 뒤집기">
      <span class="num">${w.id}</span>
      ${front}
      ${S.flipped?back:`<span class="hint">탭하거나 Space를 눌러 정답 보기</span>`}
    </div>
    <div class="nav">
      <button class="btn" id="prev">← 이전</button>
      <span class="counter">${S.idx+1} / ${list.length}</span>
      <button class="btn primary" id="next">다음 →</button>
    </div>
    <div class="nav">
      <button class="icon" data-say="${esc(w.word)}" aria-label="발음 듣기">${ICON_SPK}</button>
      <button class="tog" data-known="${w.id}" aria-pressed="${S.known.has(w.id)}">${S.known.has(w.id)?'외움 ✓':'외움 표시'}</button>
    </div>
    <p class="hint">키보드: ← → 이동 · Space 뒤집기 · P 발음 · K 외움</p>
  </div>`;
}
function render(){
  renderSets(); renderProgress();
  ['modeSeg','blindSeg'].forEach(id=>{const key=id==='modeSeg'?'mode':'blind';
    document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S[key]))});
  document.querySelectorAll('#exSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.ex));
  $('#unknownTog').setAttribute('aria-pressed',S.onlyUnknown);
  $('#shuffleBtn').setAttribute('aria-pressed',S.shuffled);
  $('#accent').value=S.accent; $('#rate').value=S.rate;
  $('#view').innerHTML = S.mode==='card'?renderCard():renderList();
}
function save(){ store.set('set25',S.set);store.set('mode',S.mode);store.set('blind',S.blind);store.set('ex',S.ex);store.set('theme',S.theme);store.set('known',[...S.known]);store.set('accent',S.accent);store.set('rate',S.rate); }

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-reveal],#card'); if(!t) return;
  if(t.dataset.say){ speak(t.dataset.say,t); return; }
  if(t.dataset.known){ const id=+t.dataset.known; S.known.has(id)?S.known.delete(id):S.known.add(id); save(); render(); return; }
  if(t.dataset.set){ S.set=+t.dataset.set; S.idx=0; S.flipped=false; S.order=null; S.revealed.clear(); save(); render(); window.scrollTo(0,0); return; }
  if(t.closest('#modeSeg')&&t.dataset.v){ S.mode=t.dataset.v; S.flipped=false; save(); render(); return; }
  if(t.closest('#blindSeg')&&t.dataset.v){ S.blind=t.dataset.v; S.revealed.clear(); S.flipped=false; save(); render(); return; }
  if(t.closest('#exSeg')&&t.dataset.v){ S.ex=t.dataset.v; save(); render(); return; }
  if(t.id==='lockBtn'){ store.set('key',null); location.reload(); return; }
  if(t.id==='themeBtn'){ S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme]; save(); applyTheme(); return; }
  if(t.id==='gearBtn'){ const h=document.querySelector('header'); const o=h.classList.toggle('open'); t.setAttribute('aria-expanded',o); return; }
  if(t.id==='unknownTog'){ S.onlyUnknown=!S.onlyUnknown; S.idx=0; render(); return; }
  if(t.id==='shuffleBtn'){ S.shuffled=!S.shuffled; S.order=null; S.idx=0; render(); return; }
  if(t.id==='prev'){ step(-1); return; }
  if(t.id==='next'){ step(1); return; }
  if(t.id==='card'){ flip(); return; }
  if(t.dataset.reveal&&t.classList.contains('covered')){ S.revealed.add(t.dataset.reveal); t.classList.remove('covered'); if(t.dataset.reveal.startsWith('en')) render(); }
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('select,input')) return;
  const r=e.target.closest&&e.target.closest('[data-reveal].covered');
  if(r&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); r.click(); return; }
  if(S.mode!=='card') return;
  if(e.key==='ArrowRight') step(1);
  else if(e.key==='ArrowLeft') step(-1);
  else if(e.key===' '){ e.preventDefault(); flip(); }
  else if(e.key==='p'||e.key==='P'){ const w=currentWords()[S.idx]; if(w) speak(w.word); }
  else if(e.key==='k'||e.key==='K'){ const w=currentWords()[S.idx]; if(w){ S.known.has(w.id)?S.known.delete(w.id):S.known.add(w.id); save(); render(); } }
});
function step(d){ const n=currentWords().length; if(!n) return; S.idx=(S.idx+d+n)%n; S.flipped=false; render(); }
function flip(){ S.flipped=!S.flipped; render(); if(S.flipped){ const w=currentWords()[S.idx]; if(w&&S.blind==='en') speak(w.word); } }
$('#accent').addEventListener('change',e=>{S.accent=e.target.value;save()});
$('#rate').addEventListener('change',e=>{S.rate=e.target.value;save()});

/* ---------- 화면 모드 (자동 / 라이트 / 다크) ---------- */
const THEME_ICON={
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>'};
const THEME_NAME={auto:'자동',light:'라이트',dark:'다크'};
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme);
  const dark=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=dark?'#171c25':'#2448c7';
  const b=$('#themeBtn'); b.innerHTML=THEME_ICON[S.theme]; b.title='화면 모드: '+THEME_NAME[S.theme]; b.setAttribute('aria-label','화면 모드: '+THEME_NAME[S.theme]+' (눌러서 바꾸기)');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(S.theme==='auto') applyTheme(); });
applyTheme();

/* ---------- 잠금 해제 (AES-GCM) ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function decryptWith(key,enc){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function start(rows){
  ALL=rows.map(r=>({id:r[0],word:r[1],means:r[2],ex:r[3],exKo:r[4],siri:r[5],siriKo:r[6],ipa:r[7]||''}));
  $('#lock').hidden=true;
  if(!ALL.some(w=>Math.ceil(w.id/25)===S.set)) S.set=1;
  render();
}
async function boot(){
  if(!(window.crypto&&crypto.subtle)){ $('#lockErr').textContent='보안 연결(https)에서만 열 수 있어요.'; return; }
  let enc;
  try{ enc=await (await fetch('words.enc.json',{cache:'no-cache'})).json(); }
  catch(e){ $('#lockErr').textContent='데이터를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
  const saved=store.get('key',null);
  if(saved&&saved.s===enc.salt){
    try{ const key=await crypto.subtle.importKey('raw',b64(saved.k),'AES-GCM',false,['decrypt']); start(await decryptWith(key,enc)); return; }
    catch(e){ store.set('key',null); }
  }
  $('#pw').focus();
  $('#lockForm').addEventListener('submit',async ev=>{
    ev.preventDefault(); const btn=$('#unlockBtn'); const err=$('#lockErr'); err.textContent='';
    btn.disabled=true; btn.textContent='확인 중…';
    try{
      const key=await deriveKey($('#pw').value,b64(enc.salt),enc.iter);
      const rows=await decryptWith(key,enc);
      if($('#remember').checked) store.set('key',{s:enc.salt,k:b64e(await crypto.subtle.exportKey('raw',key))});
      start(rows);
    }catch(e){ err.textContent='비밀번호가 맞지 않아요.'; $('#pw').select(); }
    btn.disabled=false; btn.textContent='열기';
  });
}
/* 카드 모드: 좌우 스와이프로 이동 */
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{ if(S.mode!=='card'||!e.target.closest('.card')) return; tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ step(dx<0?1:-1); } },{passive:true});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
</script>
